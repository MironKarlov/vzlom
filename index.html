<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>IP логгер</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        h2 {
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
        }
        .info-box {
            background: #1e1e2f;
            border-radius: 12px;
            padding: 15px;
            color: #0f0;
            font-family: monospace;
            font-size: 13px;
            margin: 20px 0;
            border-left: 4px solid #00ff88;
        }
        .status {
            margin-top: 15px;
            text-align: center;
            color: #ddd;
            font-size: 14px;
        }
        .note {
            font-size: 12px;
            color: #aaa;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <h2>📡 Отслеживание визита</h2>
    <p style="color:#ddd; text-align:center;">Ваши данные будут отправлены на почту владельцу</p>

    <div class="info-box" id="info">
        ⏳ Сбор информации...
    </div>

    <div class="status" id="status"></div>
    <div class="note">
        🔒 Адрес и данные отправляются через защищённое соединение
    </div>
</div>

<script>
    // ВАШ ID ФОРМЫ (УЖЕ ВСТАВЛЕН)
    const FORMSPREE_ID = "xvznkjwl";

    async function getIP() {
        try {
            const response = await fetch('https://api.ipify.org?format=json');
            const data = await response.json();
            return data.ip;
        } catch (e) {
            return 'Не удалось определить IP';
        }
    }

    function getBrowserInfo() {
        const ua = navigator.userAgent;
        const platform = navigator.platform;
        const language = navigator.language;
        const screenSize = `${screen.width}x${screen.height}`;
        const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        const referrer = document.referrer || 'Прямой заход';
        
        let browser = 'Неизвестный';
        if (ua.includes('Chrome')) browser = 'Chrome';
        else if (ua.includes('Firefox')) browser = 'Firefox';
        else if (ua.includes('Safari')) browser = 'Safari';
        else if (ua.includes('Edge')) browser = 'Edge';
        
        return { ua, platform, language, screenSize, timezone, referrer, browser };
    }

    function displayInfo(ip, browserInfo) {
        document.getElementById('info').innerHTML = `
            🌐 IP-адрес: ${ip}<br>
            🖥️ Браузер: ${browserInfo.browser}<br>
            📱 ОС: ${browserInfo.platform}<br>
            🌍 Язык: ${browserInfo.language}<br>
            📏 Экран: ${browserInfo.screenSize}<br>
            ⏰ Часовой пояс: ${browserInfo.timezone}<br>
            🔗 Источник: ${browserInfo.referrer}
        `;
    }

    async function sendToEmail(ip, browserInfo) {
        const message = `
🔔 НОВЫЙ ВИЗИТ 🔔
═══════════════════════════
🌐 IP-адрес: ${ip}
🖥️ Браузер: ${browserInfo.browser}
📱 Платформа: ${browserInfo.platform}
🌍 Язык: ${browserInfo.language}
📏 Размер экрана: ${browserInfo.screenSize}
⏰ Часовой пояс: ${browserInfo.timezone}
🔗 Реферер: ${browserInfo.referrer}
📄 User-Agent: ${browserInfo.ua}
═══════════════════════════
Время: ${new Date().toLocaleString()}
        `;

        const formData = new FormData();
        formData.append('message', message);

        try {
            const response = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
                method: 'POST',
                body: formData,
                headers: { 'Accept': 'application/json' }
            });
            
            if (response.ok) {
                document.getElementById('status').innerHTML = '✅ Данные отправлены на почту!';
                return true;
            } else {
                document.getElementById('status').innerHTML = '❌ Ошибка отправки. Проверьте ID формы.';
                return false;
            }
        } catch (e) {
            document.getElementById('status').innerHTML = '❌ Ошибка сети: ' + e.message;
            return false;
        }
    }

    async function main() {
        const ip = await getIP();
        const browserInfo = getBrowserInfo();
        displayInfo(ip, browserInfo);
        await sendToEmail(ip, browserInfo);
    }

    main();
</script>
</body>
</html>
